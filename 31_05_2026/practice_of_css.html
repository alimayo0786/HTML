
<html>
  <head>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
      body {
      background-image: url("Gemini_Generated_Image_9q0oxa9q0oxa9q0o.png");
      background-size: 500px;
      background-repeat: repeat-y;
    }  
    p{
      width: 100px;
      border-color: yellow;
      border-radius: 5px;
      padding-left: 10px;
      margin-left: 20px;
    }
    p.dotted {border-style: dotted;}
    p.dashed {border-style: dashed;}
    p.solid {border-style: solid;}
    p.double {border-style: double;}
    p.groove {border-style: groove;}
    p.ridge {border-style: ridge;}
    p.inset {border-style: inset;}
    p.outset {border-style: outset;}
    p.none {border-style: none;}
    p.hidden {border-style: hidden;}
    p.mix {border-style: dotted dashed solid double;}
    body {
      background-color: lightblue;
    }
    div {
      background-color: green;
      opacity: 0.3;
    }
    h1 {
      color: white;
      text-align: center;
      text-shadow: 2px 2px;
      text-transform: uppercase;
      background-color: black;
      font-style: italic;
    }
    p {
      font-family: verdana;
      font-size: 20px;
    }
    </style>
  </head>
  <body>
    <h1 >Ya meri First CSS Example ha</h1>
    <p>This is a paragraph.</p>
    <div>ma ya practice kr raha hu </div>
    <a href="http://whatsapp.com" target="blank"><button>Link</button></a>
    <p class="dotted">Ali</p>
    <p class="dashed">Hassan</p>
    <p class="solid">Mayo</p>
    <p class="double">Ali Hassan</p>
    <p class="groove">Ali Hassan Mayo</p>
    <p class="ridge">ALI HASSAN MAYO</p>
    <p class="inset">ali hassan mayo</p>
    <p class="outset">alihassan</p>
    <p class="none">ALI HASSAN</p>
    <p class="hidden">ali</p>
    <p class="mix">hassan mayo</p>


        <i class="fas fa-cloud"></i>

  </body>
</html>
